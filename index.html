<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Different Places Game Show</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Game show: deep stage purple, spotlight gold, four answer colours */
:root{--stage:#1b0f3b;--stage2:#2c1763;--gold:#ffcf3f;--ink:#fff;--soft:#c9bfe8;
  --o0:#ff4f7b;--o1:#2ec4b6;--o2:#ff9f1c;--o3:#6c7bff}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:radial-gradient(ellipse at 50% -10%,#4a2a9a 0%,var(--stage2) 35%,var(--stage) 75%);color:var(--ink);font:18px/1.35 Nunito,system-ui,sans-serif;overflow-x:hidden}
h1,h2,.bung{font-family:Bungee,Nunito,sans-serif;font-weight:400;letter-spacing:.01em;margin:0;line-height:1.05}
button{font:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}
.kr{display:block;font-size:.72em;opacity:.8;font-weight:700;word-break:keep-all}
/* ---------- HOST ---------- */
.host{min-height:100vh;display:flex;flex-direction:column;padding:2vh 3vw}
.top{display:flex;align-items:center;gap:16px}
.top .logo{font-family:Bungee;font-size:clamp(18px,1.8vw,28px);color:var(--gold);text-shadow:0 3px 0 #a1450a}
.top .sp{flex:1}
.pill{background:rgba(255,255,255,.12);border-radius:999px;padding:8px 16px;font-weight:800;font-size:clamp(14px,1.2vw,20px)}
.icon{background:rgba(255,255,255,.12);border:0;border-radius:12px;padding:8px 12px;font-size:18px}
.lobby{flex:1;display:grid;grid-template-columns:1.1fr .9fr;gap:4vw;align-items:center}
.lobby h1{font-size:clamp(40px,6vw,96px);color:var(--gold);text-shadow:0 6px 0 #a1450a,0 0 40px rgba(255,207,63,.35)}
.lobby h1 small{display:block;font-size:.42em;color:#fff;text-shadow:none;margin-top:12px}
.join{background:#fff;color:#1b0f3b;border-radius:28px;padding:24px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.join #qr{width:min(34vh,360px);height:min(34vh,360px);margin:0 auto}
.join #qr img,.join #qr canvas{width:100%!important;height:100%!important}
.join .code{font-family:Bungee;font-size:clamp(32px,4vw,64px);letter-spacing:.12em;margin-top:10px}
.join .url{font-weight:800;font-size:clamp(13px,1vw,17px);opacity:.7;word-break:break-all}
.players{display:flex;flex-wrap:wrap;gap:10px;margin-top:3vh;min-height:52px}
.players span{background:rgba(255,255,255,.14);border-radius:999px;padding:8px 16px;font-weight:900;font-size:clamp(16px,1.5vw,24px);animation:pop .35s}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.big{border:0;border-radius:20px;padding:18px 34px;font-family:Bungee;font-size:clamp(20px,2vw,32px);background:var(--gold);color:#1b0f3b;box-shadow:0 8px 0 #a1450a;transition:transform .1s}
.big:active{transform:translateY(4px);box-shadow:0 4px 0 #a1450a}
.big.alt{background:#fff;box-shadow:0 8px 0 #8c7fbf}
.big:disabled{opacity:.4}
.round{flex:1;display:grid;grid-template-rows:auto auto 1fr auto;gap:2vh;padding-top:1vh}
.q{text-align:center;font-weight:900;font-size:clamp(24px,2.8vw,46px);text-wrap:balance}
.q .kr{font-size:.6em;margin-top:6px}
.stagebox{display:grid;grid-template-columns:1.25fr 1fr;gap:3vw;align-items:center;min-height:0}
.photo{border-radius:24px;overflow:hidden;box-shadow:0 0 0 8px #fff,0 30px 60px rgba(0,0,0,.5);max-height:48vh;background:#000}
.photo img{display:block;width:100%;max-height:48vh;object-fit:cover}
.opts{display:grid;gap:1.6vh}
.opt{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;border-radius:18px;padding:1.4vh 18px;font-weight:900;font-size:clamp(18px,2vw,32px);background:var(--c);position:relative;overflow:hidden;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.opt .em{font-size:1.3em}
.opt .bar{position:absolute;inset:0 auto 0 0;background:rgba(255,255,255,.28);width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.opt .n{font-family:Bungee;position:relative}
.opt>*{position:relative}
.foot{display:flex;align-items:center;gap:20px;justify-content:center;flex-wrap:wrap}
.timer{font-family:Bungee;font-size:clamp(40px,5vw,80px);color:var(--gold);min-width:2.2em;text-align:center}
.timer.low{color:#ff4f7b;animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.12)}}
.count{font-weight:900;font-size:clamp(18px,1.8vw,28px)}
/* spotlight */
.spot{position:fixed;inset:0;z-index:20;background:rgba(10,5,25,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;padding:4vw;text-align:center}
.spot::before{content:"";position:absolute;inset:0;background:conic-gradient(from 0deg at 50% 120%,transparent 0 40%,rgba(255,207,63,.18) 45%,transparent 50% 100%);pointer-events:none}
.reel{font-family:Bungee;font-size:clamp(48px,8vw,140px);color:var(--gold);text-shadow:0 8px 0 #a1450a;min-height:1.2em}
.spot .tag{display:inline-block;border-radius:999px;padding:8px 22px;font-weight:900;font-size:clamp(18px,2vw,30px);background:var(--c)}
.spot .fq{font-weight:900;font-size:clamp(26px,3.4vw,58px);max-width:1300px;text-wrap:balance}
.spot .btns{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;position:relative}
.confetti{position:fixed;top:-20px;width:12px;height:18px;z-index:30;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.end{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;text-align:center}
.end h1{font-size:clamp(48px,7vw,120px);color:var(--gold);text-shadow:0 6px 0 #a1450a}
/* ---------- PLAYER ---------- */
.ply{min-height:100dvh;display:flex;flex-direction:column;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto}
.ply .logo{font-family:Bungee;color:var(--gold);font-size:20px;text-align:center;text-shadow:0 2px 0 #a1450a;margin:6px 0 16px}
.card{background:rgba(255,255,255,.1);border-radius:22px;padding:20px}
.field{width:100%;min-height:56px;border:0;border-radius:16px;padding:12px 16px;font:800 22px Nunito,sans-serif;text-align:center;margin:10px 0}
.pbtn{width:100%;min-height:60px;border:0;border-radius:18px;background:var(--gold);color:#1b0f3b;font-family:Bungee;font-size:22px;box-shadow:0 6px 0 #a1450a}
.pbtn:disabled{opacity:.4}
.center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px}
.center .bigem{font-size:72px}
.thumb{border-radius:16px;overflow:hidden;margin-bottom:12px;box-shadow:0 0 0 4px #fff}
.thumb img{display:block;width:100%;max-height:28vh;object-fit:cover}
.pq{font-weight:900;font-size:19px;text-align:center;margin-bottom:12px}
.pgrid{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pv{border:0;border-radius:20px;background:var(--c);font-weight:900;font-size:21px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:110px;box-shadow:0 6px 0 rgba(0,0,0,.3);transition:transform .1s}
.pv .em{font-size:40px}
.pv[aria-pressed=true]{outline:5px solid #fff;transform:scale(1.04)}
.pgrid.locked .pv:not([aria-pressed=true]){opacity:.35}
.pstat{text-align:center;font-weight:800;margin-top:12px;min-height:1.4em}
.steps{display:flex;gap:1.2vw;justify-content:center;flex-wrap:wrap}
.steps span{background:rgba(255,255,255,.12);border-radius:14px;padding:.8vh 1.2vw;font-weight:900;font-size:clamp(14px,1.35vw,22px);transition:opacity .3s,background .3s}
.steps span.on{background:var(--gold);color:#1b0f3b;box-shadow:0 4px 0 #a1450a}
.steps span.off{opacity:.35}
.steps .kr{font-size:.75em}
.modal{position:fixed;inset:0;z-index:40;background:rgba(10,5,25,.85);display:flex;align-items:center;justify-content:center;padding:3vh}
.sheet{background:#fff;color:#1b0f3b;border-radius:24px;padding:24px 28px;width:min(720px,100%);max-height:94vh;overflow:auto}
.sheet h2{font-family:Bungee;font-size:26px;margin-bottom:6px}
.sheet h3{font-size:14px;text-transform:uppercase;letter-spacing:.06em;opacity:.6;margin:18px 0 6px}
.row{display:flex;align-items:center;gap:12px;padding:8px 0;font-weight:800;font-size:17px;cursor:pointer}
.row input[type=checkbox]{width:22px;height:22px;flex:none}
.row select{font:800 16px Nunito,sans-serif;padding:6px 10px;border-radius:10px;margin-left:auto}
.row small{display:block;font-weight:600;opacity:.65;font-size:13px}
.rlist .row{border-top:1px solid #eee}
.rlist img{width:64px;height:44px;object-fit:cover;border-radius:8px;flex:none}
.sheet .big{font-size:20px;padding:12px 26px;margin-top:16px}
.nokr .host .kr{display:none}
.err{color:#ffb3c4;font-weight:800;min-height:1.3em}
@media (max-width:900px){.lobby,.stagebox{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
{
const DB_URL="https://ecp-game-show-default-rtdb.asia-southeast1.firebasedatabase.app";
const SETS={places:"Different Places, Different Ways",food:"Unusual Foods Around the World"};
const SET=SETS[new URLSearchParams(location.search).get("set")]?new URLSearchParams(location.search).get("set"):null;
const DEF={timer:0,auto:true,fresh:true,kr:true,rounds:null};
let cfg={...DEF,...(JSON.parse(localStorage.getItem("gs-cfg")||"null")||{})};
const allRounds=()=>ROUNDS.map((_,i)=>i);
const startList=()=>{let l=(cfg.rounds&&cfg.rounds.length)?cfg.rounds:allRounds();if(SET){const f=l.filter(i=>ROUNDS[i].set===SET);l=f.length?f:allRounds().filter(i=>ROUNDS[i].set===SET)}return l};
const OPTS=[["😍","Love it","좋아요","--o0"],["🤔","Interesting","흥미로워요","--o1"],["😮","Strange","이상해요","--o2"],["🙅","No thanks","사양할게요","--o3"]];
const ROUNDS=[
 {set:"places",img:"nz",en:"In New Zealand, many people walk barefoot outside — to school or the supermarket.",ko:"뉴질랜드에서는 많은 사람들이 맨발로 학교나 마트에 가요.",
  f:["Where would you like to walk barefoot? Why?","Why do you think New Zealanders do this?","What feels strange about it? Where do Koreans take off their shoes?","What worries you about it? Where do you like to be barefoot?"]},
 {set:"places",img:"spain",en:"In Spain, dinner often starts at 9–11 pm.",ko:"스페인에서는 저녁 식사를 보통 밤 9~11시에 시작해요.",
  f:["What would you do in the evening before a late dinner?","Why do you think dinner is so late in Spain?","What time do you usually eat dinner? What would be hard about eating late?","What would you do if a Spanish friend invited you to dinner at 10 pm?"]},
 {set:"places",img:"nl",en:"In the Netherlands, people ride bikes everywhere.",ko:"네덜란드에서는 사람들이 어디든 자전거를 타고 다녀요.",
  f:["Would you ride a bike to work or school? Why?","Why do you think cycling is so popular there?","What would make cycling difficult in your city?","How do you prefer to get around? Why?"]},
 {set:"places",img:"pharmacy",en:"In some countries, you can buy many medicines without a doctor's prescription.",ko:"어떤 나라에서는 처방전 없이 많은 약을 살 수 있어요.",
  f:["Why might this be convenient?","How is buying medicine different in Korea?","What could be a problem with this system?","Would you rather see a doctor first? Why?"]},
 {set:"places",img:"thumb",en:"In Malaysia, people point with their thumb, not their index finger.",ko:"말레이시아에서는 검지 대신 엄지로 가리켜요.",
  f:["Can you show us? Is there a polite gesture like this in Korea?","Why might pointing with a finger feel rude?","Which Korean gestures might feel strange to visitors?","Would it be hard to change your habit? What would you do?"]},
 {set:"places",img:"tp",en:"In France, toilet paper is often coloured — sometimes pink!",ko:"프랑스에서는 화장지가 색깔이 있는 경우가 많아요. 분홍색도 있어요!",
  f:["Would you buy coloured toilet paper? What colour?","Why do you think people choose coloured paper?","What is something in Korean homes that visitors find surprising?","Why do you prefer white? Does colour matter to you?"]},
 {set:"places",img:"beer",en:"In the Czech Republic, beer is often cheaper than water in restaurants.",ko:"체코의 식당에서는 맥주가 물보다 싼 경우가 많아요.",
  f:["What would you order in a Czech restaurant?","Why might beer be so cheap there?","Is there a drink in Korea that is surprisingly cheap?","What would you drink instead? Is free water important to you?"]},
 {set:"food",img:"balut",en:"Philippines: Balut is a developing duck egg that is boiled and eaten from the shell.",ko:"필리핀의 발룻: 부화 중인 오리알을 삶아서 껍질째 먹어요.",
  f:["Would you try it alone or with friends? Why?","Why do you think balut is a popular street food?","Which Korean food might look strange to visitors?","What is a food you will never try? Why?"]},
 {set:"food",img:"snake",en:"Southeast Asia: Snake wine is rice wine with a snake inside. People say it gives energy and helps hair loss.",ko:"동남아시아의 뱀술: 쌀술 안에 뱀이 들어 있어요. 기운을 주고 탈모에 좋다고 해요.",
  f:["What healthy food or drink do you enjoy?","Why do you think people believe some foods give energy?","Is there a Korean health food that visitors find strange?","What do you say when someone offers you food you don't want?"]},
 {set:"food",img:"grass",en:"Thailand: Fried grasshoppers are a popular snack.",ko:"태국: 메뚜기 튀김은 인기 있는 간식이에요.",
  f:["What do you think they taste like?","Why might insects be a good food for the future?","Have you ever eaten 번데기? What was it like?","Would you try one if everyone else did? Why or why not?"]},
 {set:"food",img:"fish",en:"Japan: \"Dancing fish\" are tiny live fish you swallow from a glass with vinegar and soy sauce.",ko:"일본의 '춤추는 물고기': 식초와 간장을 넣은 잔에서 살아 있는 작은 물고기를 삼켜요.",
  f:["What is the most adventurous thing you have eaten?","Why do you think people enjoy very fresh, live food?","How is this similar to Korean 산낙지?","Do you prefer raw food or cooked food? Why?"]},
 {set:"food",img:"grub",en:"Australia: Witchetty grubs are the larvae of a large moth, a traditional food of Aboriginal people.",ko:"호주의 위체티 그럽: 큰 나방의 애벌레로, 원주민의 전통 음식이에요.",
  f:["Would you eat it raw or cooked?","Why do you think it became a traditional food?","What traditional Korean food do young people rarely eat now?","What Australian food would you rather try?"]},
 {set:"food",img:"reindeer",en:"Finland: Reindeer sausage is often served with a dip.",ko:"핀란드: 순록 소시지는 소스와 함께 먹는 경우가 많아요.",
  f:["What would you eat it with?","Why do you think people in Finland eat reindeer?","Is there a food in Korea that surprises visitors?","Which meat do you like best? Why?"]},
 {set:"food",img:"omelette",en:"Vietnam (Hanoi): Worm omelette is made with worms, eggs, minced pork, green onions and tangerine peel.",ko:"베트남(하노이)의 벌레 오믈렛: 벌레, 달걀, 다진 돼지고기, 파, 귤껍질로 만들어요.",
  f:["What would you add to make your perfect omelette?","Why do you think worms are used as food?","What Korean egg dish would you show a Vietnamese friend?","What Vietnamese food would you choose instead?"]},
 {set:"food",img:"century",en:"China: Century eggs are duck, chicken or quail eggs preserved for weeks, eaten in porridge or tofu salad.",ko:"중국의 피단: 오리알, 달걀, 메추리알을 몇 주 동안 보존해서 죽이나 두부 샐러드에 넣어 먹어요.",
  f:["Would you eat it in porridge or tofu salad?","Why do you think people started preserving eggs?","Which Korean fermented food is similar in some way?","What egg dish do you love?"]}
];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const rid=n=>Array.from(crypto.getRandomValues(new Uint8Array(n)),b=>"abcdefghjkmnpqrstuvwxyz23456789"[b%31]).join("");
firebase.initializeApp({databaseURL:DB_URL});
const db=firebase.database();
let offset=0;db.ref(".info/serverTimeOffset").on("value",s=>offset=s.val()||0);
const now=()=>Date.now()+offset;
const params=new URLSearchParams(location.search);
const listOf=S=>(S&&S.list&&S.list.length)?S.list:allRounds();
const curRound=S=>ROUNDS[listOf(S)[S.round]]||ROUNDS[0];
const optTag=i=>`<span class="tag" style="background:var(${OPTS[i][3]})">${OPTS[i][0]} ${OPTS[i][1]}</span>`;

/* ===== sound (host only) ===== */
let AC=null,muted=false;
function tone(f,d,type="sine",v=.15,when=0){if(muted)return;try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime+when);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+when+d);o.connect(g).connect(AC.destination);o.start(AC.currentTime+when);o.stop(AC.currentTime+when+d)}catch(e){}}
const sfx={tick:()=>tone(880,.08,"square",.05),join:()=>{tone(660,.1);tone(990,.15,"sine",.12,.08)},
 lock:()=>{tone(392,.15,"sawtooth",.08);tone(523,.15,"sawtooth",.08,.12);tone(784,.35,"sawtooth",.1,.24)},
 reel:()=>tone(300+Math.random()*500,.05,"triangle",.06),
 win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.25,"triangle",.12,i*.1))};
function confetti(){const cols=["#ffcf3f","#ff4f7b","#2ec4b6","#6c7bff","#fff"];for(let i=0;i<80;i++){const c=document.createElement("i");c.className="confetti";c.style.left=Math.random()*100+"vw";c.style.background=cols[i%5];c.style.animationDuration=(1.8+Math.random()*1.6)+"s";c.style.animationDelay=Math.random()*.4+"s";document.body.appendChild(c);setTimeout(()=>c.remove(),4000)}}

/* ===== HOST ===== */
function host(){
  let g=store.get("gs-host");
  if(!g||params.get("new")){g={code:String(1000+Math.floor(Math.random()*9000)),key:rid(16)};store.set("gs-host",g);if(params.get("new"))history.replaceState(null,"","?host")}
  const ref=db.ref("games/"+g.code);
  let S={phase:"lobby",round:0,endsAt:0,pick:null,picked:{}},players={},votes={},tickT=null,lastTick=-1;
  const joinUrl=location.origin+location.pathname+"?g="+g.code;
  const put=patch=>{S={...S,...patch};ref.child("state").set({...S,key:g.key})};
  ref.child("state").once("value",s=>{const v=s.val();if(v&&v.key===g.key){delete v.key;S={...S,...v};if(SET&&S.set!==SET&&(S.phase==="end"||S.phase==="lobby"||S.phase==="results")){S={...S,phase:"lobby",round:0,pick:null,picked:{},set:SET};ref.child("votes").remove();put({})}}else put({set:SET});render()});
  ref.child("players").on("value",s=>{const n=s.val()||{};if(Object.keys(n).length>Object.keys(players).length&&S.phase==="lobby")sfx.join();players=n;render()});
  ref.child("votes").on("value",s=>{votes=s.val()||{};if(S.phase!=="lobby")renderLive()});
  $("#root").innerHTML=`<div class="host"><div class="top"><div class="logo">🌏 ${SET?SETS[SET]:"Culture Game Show"}</div><div class="sp"></div><span class="pill" id="pcount"></span><span class="pill">Code <b>${g.code}</b></span><button class="icon" id="mute" title="Sound">🔊</button><button class="icon" id="cfg" title="Settings">⚙️ Settings</button><button class="icon" id="newg" title="New game">↺</button></div><div id="view" style="flex:1;display:flex;flex-direction:column"></div></div><div id="spot" class="spot hidden"></div>`;
  $("#mute").onclick=()=>{muted=!muted;$("#mute").textContent=muted?"🔇":"🔊"};
  $("#cfg").onclick=settings;document.body.classList.toggle("nokr",!cfg.kr);
  $("#newg").onclick=()=>{if(confirmTwice($("#newg")))location.href="?host&new=1"};
  function confirmTwice(b){if(b.dataset.arm){return true}b.dataset.arm=1;b.textContent="Sure?";setTimeout(()=>{delete b.dataset.arm;b.textContent="↺"},2500);return false}
  const roundVotes=()=>votes["r"+S.round]||{};
  function tally(){const t=[0,0,0,0];Object.values(roundVotes()).forEach(v=>{if(t[v]!=null)t[v]++});return t}
  function render(){
    $("#pcount").textContent=`👥 ${Object.keys(players).length}`;
    const v=$("#view");clearInterval(tickT);
    if(S.phase==="lobby"){
      v.innerHTML=`<div class="lobby"><div><h1>Game Show!<small>How does it make you feel?<span class="kr">어떤 느낌이 드나요?</span></small></h1>
        <div class="steps" style="justify-content:flex-start;margin-top:3vh"><span>📷 Scan the QR code<span class="kr">QR 코드를 스캔하세요</span></span><span>✏️ Type your name<span class="kr">이름을 쓰세요</span></span></div>
        <div class="players">${Object.values(players).map(n=>`<span>${esc(n)}</span>`).join("")||'<span style="opacity:.5">Waiting for players…</span>'}</div>
        <div style="margin-top:4vh"><button class="big" id="start" ${Object.keys(players).length?"":"disabled"}>Start the show ▶</button></div></div>
        <div class="join"><div id="qr"></div><div class="code">${g.code}</div><div class="url">${esc(joinUrl.replace(/^https?:\/\//,""))}</div></div></div>`;
      new QRCode($("#qr"),{text:joinUrl,width:512,height:512,correctLevel:QRCode.CorrectLevel.M});
      $("#start").onclick=()=>{S.list=startList();S.picked={};S.set=SET;openRound(0)};
    } else if(S.phase==="end"){
      v.innerHTML=`<div class="end"><h1>That's a wrap!</h1><div class="q">Thanks for playing, everyone 👏<span class="kr">참여해 주셔서 감사합니다!</span></div><button class="big alt" id="again">Play again</button></div>`;
      $("#again").onclick=()=>{put({phase:"lobby",round:0,pick:null,picked:{}});ref.child("votes").remove();render()};confetti();sfx.win();
    } else {
      const R=curRound(S);
      v.innerHTML=`<div class="round"><div class="q">${esc(R.en)}<span class="kr">${esc(R.ko)}</span></div>
        <div class="steps" id="steps"></div>
        <div class="stagebox"><div class="photo"><img src="img/${R.img}.jpg" alt=""></div><div class="opts">${OPTS.map((o,i)=>`<div class="opt" style="--c:var(${o[3]})"><div class="bar" id="b${i}"></div><span class="em">${o[0]}</span><span>${o[1]}<span class="kr">${o[2]}</span></span><span class="n" id="n${i}"></span></div>`).join("")}</div></div>
        <div class="foot" id="foot"></div></div>`;
      renderLive();
      if(S.phase==="vote"){tickT=setInterval(tick,250);tick()}
    }
    renderSpot();
  }
  function renderLive(){
    if(S.phase==="lobby"||S.phase==="end"||!$("#foot"))return;
    const t=tally(),tot=t.reduce((a,b)=>a+b,0),np=Object.keys(players).length,show=S.phase!=="vote";
    t.forEach((c,i)=>{const b=$("#b"+i),n=$("#n"+i);if(!b)return;b.style.width=show&&tot?(c/tot*100)+"%":"0";n.textContent=show?c:""});
    const f=$("#foot");
    if(S.phase==="vote"){const timed=S.endsAt>0;
      f.innerHTML=`<div class="timer ${timed?"":"hidden"}" id="tm"></div><div class="count">${tot} / ${np} voted<span class="kr">투표 완료</span></div>${timed?'<button class="big alt" id="stopt">⏸ Stop timer</button>':'<button class="big alt" id="ten">⏱ 10 seconds left!</button>'}<button class="big" id="lockb">Lock votes 🔒</button>`;
      $("#lockb").onclick=lock;if(timed)$("#stopt").onclick=()=>{put({endsAt:0});renderLive()};else $("#ten").onclick=()=>{put({endsAt:now()+10000});lastTick=-1;renderLive()};tick()}
    else{const last=S.round>=listOf(S).length-1;f.innerHTML=`<div class="count">${tot} votes</div><button class="big" id="spin" ${tot?"":"disabled"}>🎤 Pick a player!</button><button class="big alt" id="next">${last?"Finish 🏁":"Next round ▶"}</button>`;
      $("#spin").onclick=spin;$("#next").onclick=()=>last?put({phase:"end",pick:null})||render():openRound(S.round+1)}
    const st=$("#steps");if(st){const v=S.phase==="vote";st.innerHTML=`<span class="${v?"on":"off"}">① 👀 Look at the photo<span class="kr">사진을 보세요</span></span><span class="${v?"on":"off"}">② 📱 Vote on your phone<span class="kr">휴대폰으로 투표하세요</span></span><span class="${v?"off":"on"}">③ 🎤 If you're picked, answer the question!<span class="kr">뽑히면 질문에 답하세요</span></span>`}
    if(cfg.auto&&tot>=np&&np&&S.phase==="vote")lock();
  }
  function tick(){if(!(S.endsAt>0)){lastTick=-1;return}const left=Math.max(0,Math.ceil((S.endsAt-now())/1000)),el=$("#tm");if(el){el.textContent=left;el.classList.toggle("low",left<=5)}
    if(left!==lastTick&&left<=5&&left>0)sfx.tick();lastTick=left;if(left<=0&&S.phase==="vote")lock()}
  function openRound(r){put({phase:"vote",round:r,endsAt:cfg.timer?now()+cfg.timer*1000:0,pick:null});ref.child("votes/r"+r).remove();render()}
  function lock(){if(S.phase!=="vote")return;put({phase:"results"});sfx.lock();render()}
  function spin(){
    const rv=roundVotes(),ids=Object.keys(rv).filter(p=>players[p]);if(!ids.length)return;
    const fresh=cfg.fresh?ids.filter(p=>!(S.picked||{})[p]):ids,pool=fresh.length?fresh:ids,pid=pool[Math.floor(Math.random()*pool.length)];
    const sp=$("#spot");sp.classList.remove("hidden");sp.innerHTML=`<div style="font-size:24px;font-weight:800;opacity:.8">And the spotlight goes to…</div><div class="reel" id="reel"></div>`;
    const names=ids.map(p=>players[p]);let i=0,delay=50;
    const step=()=>{$("#reel").textContent=names[i++%names.length];sfx.reel();delay*=1.12;if(delay<420)setTimeout(step,delay);else land()};
    const land=()=>{put({phase:"results",pick:{pid,name:players[pid],opt:rv[pid]},picked:{...(S.picked||{}),[pid]:true}});sfx.win();confetti();renderSpot()};
    step();
  }
  function settings(){
    const m=document.createElement("div");m.className="modal";
    const sel=cfg.rounds||allRounds();
    m.innerHTML=`<div class="sheet"><h2>⚙️ Settings</h2><div style="opacity:.7;font-weight:700">Saved on this computer. Changes apply from the next round.</div>
      <h3>Voting</h3>
      <label class="row">⏱ Countdown timer<small>&nbsp;</small><select id="s-timer">${[0,10,15,20,30,45,60].map(t=>`<option value="${t}" ${cfg.timer==t?"selected":""}>${t?t+" seconds":"Off (I'll lock it)"}</option>`).join("")}</select></label>
      <label class="row"><input type="checkbox" id="s-auto" ${cfg.auto?"checked":""}><span>Lock votes automatically when everyone has voted<small>Turn off if you want time to talk before showing results</small></span></label>
      <h3>Picking players</h3>
      <label class="row"><input type="checkbox" id="s-fresh" ${cfg.fresh?"checked":""}><span>Pick people who haven't answered yet first<small>Off = anyone who voted can be picked again</small></span></label>
      <h3>Display</h3>
      <label class="row"><input type="checkbox" id="s-kr" ${cfg.kr?"checked":""}><span>Show Korean translations on the projector<small>Phones always show both</small></span></label>
      <label class="row"><input type="checkbox" id="s-snd" ${muted?"":"checked"}><span>Sound effects</span></label>
      <h3>Rounds to play <small style="text-transform:none;letter-spacing:0">(from the next new show; the Places / Foods links in the slides only use their own rounds)</small></h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="icon" style="background:#eee" data-q="all">All</button><button class="icon" style="background:#eee" data-q="places">Places only</button><button class="icon" style="background:#eee" data-q="food">Foods only</button><button class="icon" style="background:#eee" data-q="none">None</button></div>
      <div class="rlist">${ROUNDS.map((r,i)=>`${i===0||ROUNDS[i-1].set!==r.set?`<h3>${SETS[r.set]}</h3>`:""}<label class="row"><input type="checkbox" class="s-r" value="${i}" ${sel.includes(i)?"checked":""}><img src="img/${r.img}.jpg" alt=""><span>${esc(r.en)}</span></label>`).join("")}</div>
      <div class="err" id="s-err" style="color:#c0103f"></div>
      <button class="big" id="s-save">Save ✓</button> <button class="big alt" id="s-x">Cancel</button></div>`;
    document.body.appendChild(m);
    m.querySelector("#s-x").onclick=()=>m.remove();
    m.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>m.querySelectorAll(".s-r").forEach(c=>c.checked=b.dataset.q==="all"||ROUNDS[+c.value].set===b.dataset.q));
    m.querySelector("#s-save").onclick=()=>{
      const rs=[...m.querySelectorAll(".s-r:checked")].map(x=>+x.value);
      if(!rs.length)return m.querySelector("#s-err").textContent="Choose at least one round.";
      cfg={timer:+m.querySelector("#s-timer").value,auto:m.querySelector("#s-auto").checked,fresh:m.querySelector("#s-fresh").checked,kr:m.querySelector("#s-kr").checked,rounds:rs.length===ROUNDS.length?null:rs};
      muted=!m.querySelector("#s-snd").checked;$("#mute").textContent=muted?"🔇":"🔊";
      try{localStorage.setItem("gs-cfg",JSON.stringify(cfg))}catch(e){}
      document.body.classList.toggle("nokr",!cfg.kr);m.remove();render()};
  }
  function renderSpot(){
    const sp=$("#spot");if(!S.pick||S.phase!=="results"){sp.classList.add("hidden");return}
    const R=curRound(S),o=S.pick.opt;sp.classList.remove("hidden");
    sp.innerHTML=`<div class="reel">${esc(S.pick.name)}</div><div>${optTag(o)}</div><div class="fq">${esc(R.f[o])}</div>
      <div class="btns"><button class="big alt" id="again2">🎤 Pick another</button><button class="big" id="close">Back ✓</button></div>`;
    $("#close").onclick=()=>{put({pick:null});renderSpot()};$("#again2").onclick=()=>{put({pick:null});spin()};
  }
}

/* ===== PLAYER ===== */
function player(){
  let code=params.get("g")||"",me=null,S=null,myVote=null,unsub=[];
  const R=$("#root");
  function joinScreen(err){
    R.innerHTML=`<div class="ply"><div class="logo">🌏 Game Show</div><div class="center"><div class="card" style="width:100%">
      <div style="font-weight:900;font-size:20px">Join the game<span class="kr">게임 참가</span></div>
      <input class="field" id="code" inputmode="numeric" maxlength="4" placeholder="Code · 코드" value="${esc(code)}" ${code?'style="display:none"':''}>
      <input class="field" id="name" maxlength="20" placeholder="Your name · 이름" autocomplete="off">
      <div class="err" id="err">${err||""}</div><button class="pbtn" id="go">Join ▶</button></div></div></div>`;
    const saved=store.get("gs-name");if(saved)$("#name").value=saved;
    $("#go").onclick=async()=>{const c=$("#code").value.trim(),n=$("#name").value.trim().slice(0,20);if(!/^\d{4}$/.test(c))return $("#err").textContent="Check the 4-digit code · 코드를 확인하세요";if(!n)return $("#err").textContent="Type your name · 이름을 쓰세요";
      $("#go").disabled=true;const st=await db.ref("games/"+c+"/state").once("value");if(!st.exists()){$("#go").disabled=false;return $("#err").textContent="Game not found · 게임을 찾을 수 없어요"}
      code=c;let ids=store.get("gs-ids")||{};const pid=ids[c]||rid(10);ids[c]=pid;store.set("gs-ids",ids);store.set("gs-name",n);
      await db.ref(`games/${c}/players/${pid}`).set(n);me={pid,name:n};listen()};
    $("#name").addEventListener("keydown",e=>{if(e.key==="Enter")$("#go").click()});
  }
  function listen(){
    const sref=db.ref(`games/${code}/state`);
    sref.on("value",s=>{S=s.val()||{};draw()});
  }
  let lastRound=-1;
  async function draw(){
    if(!S)return;
    if(S.phase==="lobby"||S.phase==="end"){R.innerHTML=`<div class="ply"><div class="logo">🌏 Game Show</div><div class="center"><div class="bigem">${S.phase==="end"?"🎉":"⏳"}</div><div style="font-weight:900;font-size:24px">${S.phase==="end"?"Thanks for playing!":"You're in, "+esc(me.name)+"!"}</div><div class="kr" style="font-size:17px">${S.phase==="end"?"참여해 주셔서 감사합니다!":"화면을 보세요. 곧 시작해요!"}</div></div></div>`;return}
    const Rd=curRound(S);
    if(S.round!==lastRound){lastRound=S.round;const v=await db.ref(`games/${code}/votes/r${S.round}/${me.pid}`).once("value");myVote=v.val()}
    if(S.pick&&S.pick.pid===me.pid&&S.phase==="results"){
      R.innerHTML=`<div class="ply"><div class="logo">🌏 Game Show</div><div class="center"><div class="bigem">🎤</div><div class="bung" style="font-size:28px;color:var(--gold)">You're in the spotlight!</div><div class="kr" style="font-size:17px">당신 차례예요!</div><div class="card" style="font-weight:900;font-size:21px">${esc(Rd.f[S.pick.opt])}</div></div></div>`;if(navigator.vibrate)navigator.vibrate([120,60,120]);return}
    const locked=S.phase!=="vote";
    R.innerHTML=`<div class="ply"><div class="logo">🌏 Round ${S.round+1} / ${listOf(S).length}</div>
      <div class="thumb"><img src="img/${Rd.img}.jpg" alt=""></div><div class="pq">${esc(Rd.en)}<span class="kr">${esc(Rd.ko)}</span></div>
      <div class="pgrid ${locked?"locked":""}">${OPTS.map((o,i)=>`<button class="pv" data-v="${i}" style="--c:var(${o[3]})" aria-pressed="${myVote===i}" ${locked?"disabled":""}><span class="em">${o[0]}</span>${o[1]}<span class="kr">${o[2]}</span></button>`).join("")}</div>
      <div class="pstat" id="pstat">${locked?(myVote==null?"Votes are locked · 투표 마감":"Locked in! Watch the screen 👀 · 화면을 보세요"):(myVote==null?"How does it make you feel? · 어떤 느낌이에요?":"Voted! You can still change · 바꿀 수 있어요")}</div></div>`;
    R.querySelectorAll(".pv").forEach(b=>b.onclick=async()=>{const v=+b.dataset.v;myVote=v;R.querySelectorAll(".pv").forEach(x=>x.setAttribute("aria-pressed",+x.dataset.v===v));$("#pstat").textContent="Voted! You can still change · 바꿀 수 있어요";if(navigator.vibrate)navigator.vibrate(30);
      try{await db.ref(`games/${code}/votes/r${S.round}/${me.pid}`).set(v)}catch(e){$("#pstat").textContent="Not sent — try again · 다시 눌러 주세요"}});
  }
  joinScreen();
}
if(params.has("host"))host();else player();
}
</script>
</body>
</html>
